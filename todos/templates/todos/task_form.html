<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая задача</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            border-radius: 1rem;
        }

        input[type="text"],
        textarea {
            display: block;
            width: 100%;
            padding: 0.5rem 0.75rem;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 0.5rem;
            margin-bottom: 1.25rem;
        }

        textarea {
            height: 130px;
        }

        label {
            font-weight: 500;
            margin-bottom: 0.4rem;
            color: #495057;
        }
    </style>
</head>

<body>

    <div class="container py-5" style="max-width: 550px;">
        <a href="{% url 'task_list' %}" class="text-decoration-none text-muted mb-3 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i> Отмена
        </a>

        <div class="card border-0 shadow-sm p-4">
            <h1 class="h3 fw-bold mb-4 text-primary"><i class="bi bi-plus-circle me-2"></i>Новая задача</h1>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 btn-lg rounded-3 shadow-sm mt-2">
                    <i class="bi bi-check-lg me-1"></i> Сохранить
                </button>
            </form>
        </div>
    </div>

</body>

</html>
