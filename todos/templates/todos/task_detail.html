<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ task.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card {
            border-radius: 1rem;
        }
    </style>
</head>

<body>

    <div class="container py-5" style="max-width: 600px;">
        <a href="{% url 'task_list' %}" class="text-decoration-none text-muted mb-3 d-inline-block">
            <i class="bi bi-arrow-left me-1"></i> Назад к списку
        </a>

        <div class="card border-0 shadow-sm p-4">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h1 class="h3 fw-bold mb-0">{{ task.title }}</h1>
                {% if task.is_done %}
                <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill">
                    <i class="bi bi-check-circle me-1"></i> Выполнено
                </span>
                {% else %}
                <span
                    class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-3 py-2 rounded-pill">
                    <i class="bi bi-hourglass-split me-1"></i> В процессе
                </span>
                {% endif %}
            </div>

            <p class="text-muted small mb-4">
                <i class="bi bi-calendar3 me-1"></i> Дата создания: {{ task.created_at|date:"d.m.Y H:i" }}
            </p>

            <h6 class="text-muted fw-bold mb-2">Описание:</h6>
            <div class="bg-light p-3 rounded-3 mb-4 border">
                <p class="mb-0 text-secondary" style="white-space: pre-wrap;">{{ task.description|default:"Описание
                    отсутствует." }}</p>
            </div>

            <div class="d-flex gap-2">
                <a href="{% url 'task_toggle' task.pk %}" class="btn btn-outline-primary flex-grow-1 rounded-3">
                    <i class="bi bi-arrow-repeat me-1"></i> Сменить статус
                </a>
                <a href="{% url 'task_delete' task.pk %}" class="btn btn-outline-danger rounded-3">
                    <i class="bi bi-trash me-1"></i> Удалить
                </a>
            </div>
        </div>
    </div>

</body>

</html>
